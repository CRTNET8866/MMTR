name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Node version
        run: node -v
      - name: Run test suite (zero dependencies)
        run: npm test
      - name: Type smoke test - CLI boots
        run: node --experimental-strip-types --no-warnings src/cli.ts help
      - name: Module surface smoke test
        run: node --experimental-strip-types --no-warnings -e "const m = await import('./src/index.ts'); console.log('exports:', Object.keys(m).length)"